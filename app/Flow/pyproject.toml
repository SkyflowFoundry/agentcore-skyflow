[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Flow"
version = "0.1.0"
description = "AgentCore Runtime Application using Strands SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aws-opentelemetry-distro ~= 0.18.0",
    "bedrock-agentcore >= 1.9.1",
    "botocore[crt] >= 1.35.0",
    # Imported directly by mcp_client.sigv4 for the gateway auth hook; it also
    # arrives transitively with mcp, but a direct import deserves a direct pin.
    "httpx >= 0.27.0",
    "mcp ~= 1.24.0",
    # The anthropic extra serves model calls through the gateway; see model/gateway.py.
    "strands-agents[anthropic] >= 1.15.0",
    
]

[tool.hatch.build.targets.wheel]
packages = ["."]
